run:
  timeout: 5m
  go: "1.25"

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gosec
    - bodyclose
    - noctx
    - revive
    - gocritic

linters-settings:
  govet:
    enable-all: true
    disable:
      - shadow

  revive:
    rules:
      - name: exported
        disabled: true

  gosec:
    excludes:
      - G101
      - G304

  gocritic:
    disabled-checks:
      - commentedOutCode

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - errcheck
        - gosec
        - gocritic
    - path: "migrations/"
      linters:
        - all

  max-issues-per-linter: 50
  max-same-issues: 5
